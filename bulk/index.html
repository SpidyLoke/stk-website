<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0e0d">
<meta name="description" content="Meal clock for a 500 kcal-every-few-hours bulk. Tells you exactly when to eat.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bulk Clock">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<title>Bulk Clock</title>
</head>
<body>
<header class="top">
  <div class="brand"><span class="dot"></span>BULK CLOCK</div>
  <div class="top-meta" id="topMeta"></div>
</header>

<main id="main">
  <section class="view" id="view-today" data-view="today"></section>
  <section class="view" id="view-weight" data-view="weight" hidden></section>
  <section class="view" id="view-history" data-view="history" hidden></section>
  <section class="view" id="view-setup" data-view="setup" hidden></section>
</main>

<nav class="tabs" aria-label="Sections">
  <button class="tab active" data-tab="today">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>
    <span>Today</span>
  </button>
  <button class="tab" data-tab="weight">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg>
    <span>Weight</span>
  </button>
  <div class="fab-slot">
    <button class="fab" data-act="quick" aria-label="Quick log what you ate">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>
    </button>
  </div>
  <button class="tab" data-tab="history">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    <span>History</span>
  </button>
  <button class="tab" data-tab="setup">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
    <span>Setup</span>
  </button>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Log food" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="alarm" id="alarm" hidden></div>

<script src="app.js"></script>
</body>
</html>
