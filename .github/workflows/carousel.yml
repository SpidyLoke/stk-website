name: Deploy carousel maker and Bulk Clock

on:
  push:
    branches:
      - master
    paths:
      - 'carousel/**'
      - 'bulk/**'
      - 'bulk-cal/**'
      - '.github/workflows/carousel.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site (carousel at root, Bulk Clock at /bulk)
        run: |
          mkdir -p _pages
          cp -r carousel/. _pages/
          cp -r bulk _pages/bulk
          cp -r bulk-cal _pages/bulk-cal
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - id: deployment
        uses: actions/deploy-pages@v4
